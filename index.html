<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📝 My TODO App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="todo-container">
    <h1>📝 My TODO App</h1>

    <form id="form">
      <input type="text" id="todo-title" placeholder="Enter task title..." />
      <textarea id="todo-desc" placeholder="Enter task description..." rows="3"></textarea>
      <button type="submit">Add Task</button>
    </form>

</div>

<div id="container">
    <div class="todo-card">
    <div class="todo-title">Buy Groceries</div>
    <div class="todo-desc">Get milk, eggs, and bread from the store before evening.</div>
    <div class="todo-actions">
      <button class="btn btn-edit">✏️ Edit</button>
      <button class="btn btn-delete">🗑️ Delete</button>
    </div>
  </div>
</div>

  <script type="module" src="app.js"></script>
</body>
</html>
